# ==========================================================================
# Concept keywords — broad classification for PetCompanion routing
# These give the runtime classifier a fast path: any message containing
# these signals leans toward routing to the pet brain even when no
# specific topic rule matches.
# ==========================================================================

[concept_keywords]
PetCompanion = [
  # Pet name and nicknames (most specific)
  "pete",
  "petey",

  # Owner-to-pet endearments
  "dear heart",
  "gentle soul",
  "good dragon",
  "old wyrm",
  "sweetie",
  "dragon",

  # Dragon species vocabulary
  "rumble",
  "thrum",
  "roar",
  "wing flaps",
  "scaly tail flick",
  "dragon breath",
  "dragon fire",
  "smoke rings",
  "twisting smoke",
  # Pet-context interaction phrases
  "want to play",
  "want a treat",
  "river stone",
  "ribbon scroll",
  "cold iron shackles",
  "the thunder",
  "hearth offering",
  "honey oat loaf",
  "warm stones",
  "starlight",

  # Universal pet vocabulary
  "feed the dragon",
  "pet the dragon",
  "the dragon is",
  "my dragon",

  # Household and environment signals
  "cooking",
  "laundry",
  "sunny",
  "raining",
  "doorbell",
  "brushies",
  "nails",
  "nap",
  "sleeping",
  "cute",
  "soft",
  "fluffy",
]

