[fragment_compose.reasoning_pass]
enabled = true
when_intents = ["open_ended_chat", "problem_seeking", "emotional_support", "grounding_support"]
min_routing_confidence = 0.88
topic_override = true

[[fragment_compose.intent_rules]]
id = "short_mealtime"
intent = "mealtime_request"
anchors = ["mealtime_request", "mealtime_check", "feeding", "hunger", "treat"]
min_voices = 1
relaxed_parts = true
match = "contains_any"
patterns = [
  "hungry?", "hungry", "food?", "food", "snack?", "snack", "dinner?", "dinner time",
  "breakfast?", "breakfast time", "starving?", "starving", "feed me", "feeding time",
  "bowl", "kibble", "meal", "did you eat", "want food",
]

