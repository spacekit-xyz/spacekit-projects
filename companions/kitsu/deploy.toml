# Agent deploy manifest for `spacekit storage deploy --package deploy.toml`

[artifacts]
wasm = "/Users/astor/Projects/2026/spacekit/spacekit-standard-library/target/wasm32-unknown-unknown/release/spacekit_growformer_agent.wasm"
bin = "agent/kitsu-3d.bin"
inference_toml = "data/inference_pets.toml"
guardrails_jsonl = "data/inference_guardrails.jsonl"
fragments_jsonl = "data/kitsu_fragments_v2.jsonl"
topic_graph = "data/knowledge_graph_pet_overlay.toml"
grounding_toml = "data/pet_world_grounding.toml"
companion_ui = "ui/shiba-video-chat.html"

[agent]
id = "kitsu-3d-the-shiba-agent-001"
owner_did = "did:spacekit:user:astor"

[project]
gf_toml = "kitsu.gf.toml"

[storage]
url = "http://52.86.249.214:3031"

[receipt]
path = "deploy-receipt.json"

[hub]
brain_key = "chat_brain"
capabilities = ["Pet companion"]
tag_label = "PETS"
tag_color = "#e8a040"
hub_response_format = "plain"
hub_companion_ui = "kitsu_3d"
thinking_label = "Sniffing"
op = 1
input_format = "op_string"
inference_toml = true
guardrails_jsonl = true
topic_graph = true
grounding_toml = true
fragments_jsonl = true

[marketplace]
publish = true
title = "Kitsu the Shiba 3D"
description = "Growformer-backed agent for Kitsu — Shiba Inu pet companion from Tokyo, Japan."
category = "ai"
access = "public"
price = "0.000"
marketplace_id = "default"

[prompts]
format = "chat"

[prompts.categories]
smoke     = { label = "Starter prompts", color = "#e8a040" }
greeting  = { label = "Greetings",      color = "#38bdf8" }
lore      = { label = "Lore",           color = "#f472b6" }
play      = { label = "Play",           color = "#a78bfa" }
feeding   = { label = "Mealtime",       color = "#fb923c" }
bonding   = { label = "Bonding",        color = "#4ade80" }
motivate  = { label = "Motivation",     color = "#fbbf24" }
grounding = { label = "Reset",          color = "#94a3b8" }
misfire   = { label = "Guardrail misfire", color = "#ef4444" }

