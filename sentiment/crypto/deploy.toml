# Agent deploy manifest for `spacekit storage deploy --package deploy.toml`
# Paths are relative to this file unless absolute.

[artifacts]
wasm = "/Users/astor/Projects/2026/spacekit/spacekit-standard-library/target/wasm32-unknown-unknown/release/spacekit_growformer_crypto_analysis.wasm"
bin = "agent/crypto-brain.bin"

[agent]
id = "crypto-sentiment-analysis-agent-001"
# owner_did = "did:spacekit:..."  # optional; defaults to `spacekit init` identity

[project]
# Optional: read growformer.brain_storage_key when [hub].brain_key is omitted
gf_toml = "crypto-sentiment-analysis.gf.toml"

[storage]
# url = "http://127.0.0.1:3030"
# owner_key_algorithm = "Kyber1024"

[receipt]
path = "deploy-receipt.json"

[hub]
# Must match AGENT_BRAIN in spacekit-growformer-crypto-analysis/src/lib.rs
brain_key = "crypto_brain"
capabilities = ["Sentiment analysis"]
tag_label = "CRYPTO"
tag_color = "#0ea5e9"
hub_response_format = "growformer" # growformer | plain
thinking_label = "Analyzing"
# op = 1
# input_format = "string_only"     # string_only | op_string

[marketplace]
publish = true
title = "Crypto Sentiment Analysis"
description = "Growformer-backed agent for crypto sentiment analysis."
category = "ai"
access = "public"
price = "0.000" # pay-per-use aUSD; use "free" for no charge
marketplace_id = "default"


# Optional: preload sample prompts for the agent
# These are served to the website via the agent's FactPackage metadata
# so the frontend does not need to hardcode them.

[prompts]
format = "sentiment"

[prompts.categories]
price   = { label = "Price / Market",   color = "#1D9E75" }
fraud   = { label = "Crime / Fraud",    color = "#E24B4A" }
defi    = { label = "DeFi / Protocol",  color = "#378ADD" }
sarcasm = { label = "Sarcasm / Mixed",  color = "#BA7517" }
slang   = { label = "Slang / Register", color = "#7F77DD" }
edge    = { label = "Edge Cases",       color = "#888780" }

