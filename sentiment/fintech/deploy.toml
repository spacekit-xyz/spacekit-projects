# Agent deploy manifest for `spacekit storage deploy --package deploy.toml`
# Paths are relative to this file unless absolute.

[artifacts]
wasm = "/Users/astor/Projects/2026/spacekit/spacekit-standard-library/target/wasm32-unknown-unknown/release/spacekit_growformer_fintech_analysis.wasm"
bin = "agent/fintech-brain.bin"

[agent]
id = "fintech-sentiment-analysis-agent-001"
# owner_did = "did:spacekit:..."  # optional; defaults to `spacekit init` identity

[project]
# Optional: read growformer.brain_storage_key when [hub].brain_key is omitted
gf_toml = "fintech-sentiment-analysis.gf.toml"

[storage]
# url = "http://127.0.0.1:3030"
# owner_key_algorithm = "Kyber1024"

[receipt]
path = "deploy-receipt.json"

[hub]
# Must match AGENT_BRAIN in spacekit-growformer-fintech-analysis/src/lib.rs
brain_key = "fintech_brain"
capabilities = ["Sentiment analysis"]
tag_label = "FINANCE"
tag_color = "#0ea5e9"
hub_response_format = "growformer" # growformer | plain
thinking_label = "Analyzing"
# op = 1
# input_format = "string_only"     # string_only | op_string

[marketplace]
publish = true
title = "Fintech Sentiment Analysis"
description = "Growformer-backed agent for fintech sentiment analysis."
category = "ai"
access = "public"
price = "0.002" # pay-per-use aUSD; use "free" for no charge
marketplace_id = "default"


# Optional: preload sample prompts for the agent
# These are served to the website via the agent's FactPackage metadata
# so the frontend does not need to hardcode them.

[prompts]
format = "sentiment"

[prompts.categories]
tradfi    = { label = "TradFi / Desk",    color = "#1D9E75" }
retail    = { label = "Retail Banking",   color = "#378ADD" }
corporate = { label = "Corporate / M&A",  color = "#7F77DD" }
sarcasm   = { label = "Sarcasm / Mixed",  color = "#BA7517" }
slang     = { label = "Slang / Register", color = "#D4537E" }
edge      = { label = "Edge Cases",       color = "#888780" }

