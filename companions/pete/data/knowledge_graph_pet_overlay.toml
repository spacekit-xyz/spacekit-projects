# Knowledge graph overlay for Pete the Dragon.
# Merged on top of `knowledge_graph.toml` (Pete base — pet anchors + action_target map).
# Routes pet-directed messages to the pet_chat brain via the PetCompanion concept.
#
# Priority 16 sits above generic sentiment (~14) so pet-specific phrases win,
# but below specific coding nodes (~18–20) so "let's play with this Rust code"
# routes to coding rather than play_invitation. Name-bearing phrases use
# priority 17 since "Pete" is a strong specific signal.
#
# `topic` values match the semantic_intent labels in pete_seed.jsonl so the
# routed prompt lands on the right sub-lattice inside the pet brain.
#
# ─── HACKATHON FORK INSTRUCTIONS ──────────────────────────────────
# When forking this for a different pet (Lupita the llama, Spark the dragon,
# Toast the capybara, etc.):
#   1. Replace "pete" / "petey" / "dragon" with your pet's name and nicknames.
#   2. Swap species-specific vocabulary in concept_keywords:
#        rumble → hum (llama), squeak (capybara), roar (dragon)
#        thrum → orgle (llama), churr (capybara), rumble (dragon)
#        river stone / ribbon scroll → species-appropriate play
#        cold iron shackles → the harness, the saddle, the perch, etc.
#   3. Adjust trigger nodes for your species' fears
#      (thunder/vet/thunder for dragons; transport/shearing/storms for llamas).
#   4. Keep the topic names and category structure — those match the
#      semantic_intent labels in your training JSONL and must stay aligned.
# ──────────────────────────────────────────────────────────────────

