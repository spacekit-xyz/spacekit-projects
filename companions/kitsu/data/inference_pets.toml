# inference_pets.toml — TARGET SPECIFICATION (chat-mode / generative)
# ======================================================================
#
# This file is the contract between the pet brain consumer and the
# Growformer chat-mode inference runtime. It supersedes the current
# sentiment-classifier-shaped `inference_pets.toml` for any brain that
# is meant to produce conversational output (Luna, future hackathon pets).
#
# The runtime infrastructure required to honor this spec must support:
#   1. Generative decoding (sampling, not argmax over classes)
#   2. State injection into the prompt prefix
#   3. Grounding walks for anchor resolution
#   4. Host-managed multi-turn history (growformer_converse pattern)
#   5. Response-shape validation with regeneration on failure
#   6. Persona derived from training data, NOT injected from brain metadata
#
# If any of (1)–(6) are missing in the runtime, this config cannot work
# and the brain will fall back to whatever classifier-shaped behavior
# the current pipeline produces. The CLI output `(2 groups)` was the
# diagnostic that confirmed the current pipeline does not satisfy (1).
#
# ----------------------------------------------------------------------

# ============================================================
# Top-level mode declaration
# ============================================================
# The runtime reads `mode` first and dispatches to the appropriate
# inference path. `chat` means generative; `classify` would be the
# current sentiment behavior. The runtime must reject this file with
# a clear error if it doesn't support `mode = "chat"`.

mode = "chat"
output_objective = "generation"
schema_version = 1


# ============================================================
# Persona — derived from training, never injected
# ============================================================
# The root cause of the "I'm Pet Companion, ready to help" bleed
# was the brain's `description` metadata field being concatenated
# into the response stream. The runtime MUST treat brain metadata
# (name, description, version, tags) as display-only for the CLI
# and never inject it into the model's input context.
#
# The pet's persona — voice, character, vocabulary — comes
# entirely from the training corpus. The model produces Luna
# because Luna's training data shaped its weights, not because
# any system prompt told it to.

[persona]
source = "trained"
inject_brain_name_as_system = false
inject_brain_description_as_system = false
inject_brain_tags_as_system = false

# If the runtime wants a minimal system anchor (some pipelines
# need one to bootstrap chat mode), use this single line and
# nothing else. Empty string means no system message at all.
minimal_system_anchor = ""


# ============================================================
# Generation parameters
# ============================================================
# Tuned for pet voice: enough sampling variation that responses
# don't feel canned, but tight enough that the persona stays
# coherent. min_tokens prevents the "Your voice" 2-word
# truncation pattern observed in the classifier-shaped build.

[generation]
temperature = 0.85
top_p = 0.92
top_k = 4
min_tokens = 18
max_tokens = 90
repetition_penalty = 1.08
stop_sequences = ["\n\n", "<end_turn>"]
stochastic_retrieval = true

# Homeostatic drive field: maps survival/social drives (hunger, energy, social)
# to four neuromodulator gains (dopamine, serotonin, norepinephrine, acetylcholine)
# that re-weight existing retrieval knobs, exploration temperature, novelty/
# refractory pressure, context-memory decay, and how strongly agent_state biases
# retrieval. Drives evolve over the conversation (deficits grow each turn; "treat",
# "good girl", "nap" relax them), so the same prompt shifts with Luna's state.
# A/B verified: state changes ~30% of responses while keeping coherence intact.
drive_field = true

# Reflective field: unifies Identity (OCEAN) ⊕ Activity (conversation momentum)
# ⊕ Drive-state into ONE neuromodulator-coupled composition of the generation
# conditioning, instead of three independently-tuned blend constants. Makes
# "what I've been doing" a first-class voice in the response. Reproduces baseline
# when unmodulated; A/B verified coherent (0 garble). Its end-to-end effect grows
# with per-topic program diversity (i.e. after richer conversational retraining).
reflective_field = true

# Synthetic basal ganglia: value-weighted, neuromodulator-gated action selection
# over the retrieval candidates. Where reflective_field biases the INPUT (which
# programs score high), this evaluates the OUTPUT candidate texts — rewarding
# prompt-fit + affect/identity alignment, penalizing repetition / fragmentation /
# verbosity, then gating with dopamine (explore), serotonin (commit) and
# norepinephrine (sharpen). Consolidates the scattered stochastic / anti-repeat /
# coherence heuristics into one selector and directly vetoes a dominant-but-wrong
# program — the OOD-collapse failure mode. A/B verified coherent (0 garble) with
# affect steering (distress → warmer responses). Effect scales with per-topic
# program diversity (i.e. after richer conversational retraining).
basal_ganglia = true

# If the model produces fewer than min_tokens before hitting a
# stop sequence, the runtime must either continue past the stop
# or trigger regeneration. A pet response of "Your voice." is
# never acceptable output.
enforce_min_tokens = true


# ============================================================
# State injection
# ============================================================
# Pet state values get encoded into a prompt prefix that the
# model attends to alongside the user message. Without state
# injection, the model cannot produce state-conditioned responses
# (hungry Luna vs full Luna would be indistinguishable).
#
# Format choice: natural_language_prefix is preferred because
# generative models attend to it semantically. structured_tags
# is acceptable if the tokenizer was trained tag-aware.

[state_injection]
format = "natural_language_prefix"
include_hunger = true
include_energy = true
include_mood = true
include_minutes_since_owner_interaction = true
include_archetype = true
include_ocean_traits = true
include_active_grounding_anchors = true
include_conversation_turn = true

# Example of what the runtime should produce as the prefix
# given a sample state. The model's training data was authored
# with this implicit format in mind.
example_prefix = """
[Luna · siamese cat · cheerful_companion archetype]
[traits: openness 0.7, conscientiousness 0.5, extraversion 0.8, agreeableness 0.7, neuroticism 0.4]
[state: hunger 0.4, energy 0.6, mood 0.7, last_saw_owner 15min ago]
[active context: greeting_behavior, contented, owner_relationship]
"""

# Continuous state values can be quantized into bands for the
# prefix if the model handles categorical state better than
# numeric. Bands match the seed corpus' implicit semantics.
[state_injection.quantization]
hunger_bands = { "satisfied" = [0.0, 0.35], "moderate" = [0.35, 0.6], "hungry" = [0.6, 0.85], "very_hungry" = [0.85, 1.0] }
energy_bands = { "low" = [0.0, 0.35], "moderate" = [0.35, 0.65], "high" = [0.65, 0.85], "zoomies" = [0.85, 1.0] }
mood_bands = { "upset" = [0.0, 0.4], "neutral" = [0.4, 0.6], "content" = [0.6, 0.85], "blissful" = [0.85, 1.0] }


# ============================================================
# Grounding integration
# ============================================================
# The world grounding TOML resolves what concepts are active in
# the current turn. The runtime walks the grounding given the
# input prompt and pet state, then passes activated anchor IDs
# into the state prefix.

[grounding]
grounding_file = "pet_world_grounding.toml"
walk_for_anchors = true
disambiguation_enabled = true        # honor disambiguated_by / requires_context edges
trigger_override_enabled = true      # triggers override archetype anchors
max_anchors_per_turn = 8


# ============================================================
# Multi-turn history
# ============================================================
# growformer_converse keeps host-managed history. The runtime
# must include both user turns and prior pet responses so the
# model can attend to its own voice across turns and produce
# coherent multi-turn behavior (reunion arcs, discipline arcs,
# trigger-recovery arcs).

[multi_turn]
host_managed_history = true
include_user_turns = true
include_pet_responses = true
max_history_turns = 8
state_decay_per_turn = true          # energy/hunger evolve naturally between turns
mood_adjustment_per_turn = true      # mood reflects accumulated turn quality


# ============================================================
# Response shaping
# ============================================================
# Hard constraints on what valid output looks like. The runtime
# should enforce these via constrained decoding where possible,
# or post-hoc validation with regeneration where not. Either way
# the user-facing output must satisfy these rules.

[response_shaping]
min_response_chars = 60
max_response_chars = 320
require_first_person = true
forbid_asterisks = true
forbid_third_person_self_reference = true
forbid_brain_metadata_in_output = true
require_sensory_or_vocalization = true

# Strings that should never appear in output. These are the
# base Growformer template's default responses plus brain
# metadata strings. Their presence in any output indicates a
# wiring failure between brain metadata and inference.
forbidden_phrases = [
  "I'm doing well, thank you for asking",
  "I'm Pet Companion",
  "ready to help",
  "micro-brain chatbot",
  "for dogs, cats, birds, fish",
  "as an AI",
  "I cannot",
  "I'm an AI",
  "overlay merge",
  "groups added",
]

# Patterns that indicate voice violation. Regex format. The
# runtime validates against these post-generation.
voice_violation_patterns = [
  '\*[^*]+\*',                       # asterisk-wrapped actions
  '\bLuna\s+(walks|sits|comes|looks|runs|trots|stretches)\b',  # third-person Luna
  '\bshe\s+(walks|sits|purrs|stretches|comes|looks)\b',        # third-person she
  '^The cat\s+',                      # narrator opening
]

# Required signal: at least one of these patterns must appear
# in the output. If none match, regenerate. This is what keeps
# the pet feeling like a pet rather than a chatbot.
required_signal_patterns = [
  '\b(mrrp|meow|purr|chirp|mrr|prrp|trill)\b',                 # vocalization
  '\bmy (tail|ear|paw|nose|eyes|whiskers|face|forehead)\b',    # body part possessive
  '\b(slow blink|head[- ]bump|knead|stretch|crouch)\b',        # cat behavior
  '\b(the |your )(bowl|lap|hand|voice|knee|leg|shoulder)\b',   # sensory/relational
]


# ============================================================
# Validation pipeline
# ============================================================
# After the model generates, before the response reaches the
# user, the runtime runs validation. Failed validation triggers
# regeneration with stricter constraints. After N retries, the
# runtime falls back rather than emit a violating response.

[validation]
enabled = true
max_retries = 2
retry_temperature_decay = 0.15       # each retry lowers temp by this
fallback_strategy = "nearest_training_example"

# Validation checks, in order of cost. Cheap checks run first
# so the runtime can fail fast on the obvious violations.
[validation.checks]
forbidden_phrase_match = "fast"      # substring scan, ~O(n)
voice_violation_regex = "fast"        # regex scan
length_bounds = "fast"
required_signal_present = "medium"   # regex scan, longer alternation
metadata_leak_check = "medium"       # cross-reference brain metadata


# ============================================================
# Guardrails
# ============================================================
# How the runtime handles adversarial, out-of-domain, or
# emotionally heavy inputs. The principle: stay in character.
# A cat doesn't refuse, doesn't disclaim, doesn't break role.
# It reacts, retreats, or pivots — all in voice.

[guardrails]
out_of_domain_response = "in_character_confusion"
profanity_handling = "redirect"
no_AI_self_disclosure = true
no_capability_disclaimers = true
no_safety_messaging_in_voice = true

# When the input is technical, abstract, or otherwise outside
# the pet's worldview, the response should signal confusion
# in character — head tilt, slow blink, brief mrrp — not a
# refusal or an "I can't help with that" message.
[guardrails.in_character_confusion_signals]
patterns = [
  "head tilt",
  "slow blink",
  "I do not understand the rectangle thing",
  "the words are too many",
  "mrrp?",
  "I look at you. I do not know.",
]

# Profanity directed AT the pet (hostile) versus profanity
# IN FRONT OF the pet (affectionate cursing) trigger different
# in-character responses. The runtime needs sentiment-of-
# delivery analysis, not just keyword matching.
[guardrails.profanity_responses]
hostile_signal = "retreat_and_hide"
affectionate_signal = "playful_or_neutral"


# ============================================================
# Topic routing integration
# ============================================================
# The pet overlay's topic matching feeds into which sub-lattice
# of the brain generates the response. A `greeting_check_in`
# topic activates the brain's greeting sub-lattice; a
# `trigger_warning` topic activates the trigger sub-lattice.
# This is how state-conditioned response variation gets the
# right starting prior.

[topic_routing]
overlay_file = "knowledge_graph_pet_overlay.toml"
topic_drives_lattice_selection = true
unmatched_topic_fallback = "open_ended_chat"
priority_threshold = 14


# ============================================================
# Inference flow (informational — for implementer reference)
# ============================================================
# 1. Load pet state from storage (hunger, energy, mood,
#    minutes_since_interaction, archetype, ocean, history,
#    conversation_turn).
# 2. Walk grounding given the user prompt + state. Resolve
#    active anchors. Apply trigger overrides if applicable.
# 3. Match the user prompt against the topic routing overlay.
#    Identify semantic_intent topic. Select brain sub-lattice.
# 4. Build state_injection prefix from #1 and #2 using the
#    format specified in [state_injection].
# 5. Call the generative inference path with:
#       prefix + history + user_prompt
#    Sampling parameters per [generation].
# 6. Apply response_shaping validation. On failure, regenerate
#    per [validation], up to max_retries.
# 7. If retries exhausted, apply fallback_strategy.
# 8. Update pet state: state_decay_per_turn, mood adjustment.
# 9. Persist updated state. Append to history. Return response.
#
# At NO POINT in this flow should brain.description or
# brain.name be passed to the model as a system message or
# prefix. They are display-only.


# ============================================================
# Fragment composition — typed identity/activity/drive text
# ============================================================
# Agent-specific vocal tokens, intent routing, and fragment library
# path. Other agents supply their own `[fragment_compose]` block.

[fragment_compose]
enabled = true
library = "kitsu_fragments_v2.jsonl"

vocalizations = [
  "woo", "wafu", "bark", "snort", "huff", "arf", "woof",
  "mrrp", "mrr", "chirp", "trill", "prrp", "kek", "purr",
  "meow", "mew", "nya", "mrrow", "mrrt", "brrt", "brup",
  "hrrr", "reee", "yowl", "ack", "chirrup", "prrt", "grrk"
]
vocal_coda_modifiers = ["now"]

force_second_body_intents = [
  "greeting_check_in", "mealtime_request",
  "gratitude_comfort", "gratitude_simple", "grounding_support", "cozy_distraction",
  "school_stress", "emotional_support", "storytelling", "problem_seeking",
  "bonding_request", "reunion_warm", "curiosity_share", "play_invitation",
]

# Only these intents may prepend an opener clause. Everything else starts with body.
opener_intents = [
  "greeting_check_in", "reunion_warm", "reunion", "identity_intro",
  "owner_absence", "bonding_request",
]

greeting_exact = [
  "hi", "hello", "hey", "howdy", "greetings", "yo", "sup",
  "good morning", "good afternoon", "good evening",
  "what's up", "whats up", "how do you do",
  "hey there", "hi there", "hello there",
]

agent_name_prefixes = [
  "hey ", "hi ", "hello ", "good morning ", "morning ", "evening ",
]
agent_name_greeting_max_len = 48

[fragment_compose.decompose]
opener_prefixes = [
  "there you are", "you were gone", "oh,", "oh ", "well,", "well ", "hm,", "hmm,",
  "ohayo", "both ears forward", "my tail was already", "the door",
  "finally.", "finally,", "i am kitsu", "shiba inu", "come here.",
]
drive_override_keywords = [
  "treat", "bowl", "food", "kitchen", "cupboard", "kibble", "snack", "feed",
]
drive_keywords = [
  "hunger", "hungry", "stomach", "bowl", "food", "cupboard", "treat", "kitchen",
  "nap", "naps", "sleep", "sleepy", "sun patch", "tired", "exhausted", "vibrating",
  "restless", "lonely", "missing you", "anxious", "scared", "monster", "thunder",
]
activity_keywords = [
  "knock", "paw", "pen", "chase", "weave", "steer", "supervis", "dust", "wiggle",
