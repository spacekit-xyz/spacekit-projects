# Pet world grounding — domain-specific concept nodes for digital pet agents.
# Loaded alongside shared world_grounding.toml at runtime.
#
# Mirrors the layered structure of crypto_world_grounding.toml.
# Covers species & breeds, personality archetypes, OCEAN trait anchors,
# affective state vocabulary, owner-relationship anchors, daily-routine
# vocabulary, and ambiguity / disambiguation rules.
#
# Layer 11 aligns ids + aliases with pete_seed_v2.jsonl `semantic_intent`
# labels and user-turn phrases from scripts/generate_pete_corpus.py so the
# saliency lexicon tracks training vocabulary (hearth/ember/storm/play/etc.).

version = 1

