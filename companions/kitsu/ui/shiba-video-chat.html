<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shiba Inu Video Chat</title>
<style>
  :root { --bg:#1a1822; --ink:#f3ecdc; --accent:#e8a040; --muted:#9a93a8; --panel:rgba(20,18,28,0.82); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; overflow:hidden; }
  .chat-frame { position:absolute; inset:0; display:flex; flex-direction:column; }
  
  .video-area { flex:1; position:relative; overflow:hidden; background:#111018; }
  .video-area canvas { position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges; }
  #stateLabel { position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.5); backdrop-filter:blur(8px);
    padding:4px 14px; border-radius:20px; font-size:12px; color:var(--muted);
    letter-spacing:0.08em; text-transform:lowercase; pointer-events:none; }
  #stateLabel b { color:var(--accent); }

  #vitalsBar {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
    padding:4px 12px; border-radius:16px;
    font-size:10px; color:var(--muted); letter-spacing:0.04em;
    font-family:"IBM Plex Mono","Courier New",monospace;
    pointer-events:none; white-space:nowrap; z-index:2;
    display:none;
  }
  #vitalsBar b { color:var(--accent); font-weight:600; }

  #pxCtrl { position:absolute; top:60px; right:16px; background:var(--panel);
    backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08);
    border-radius:10px; padding:8px 12px; font-size:11px; color:var(--muted);
    display:flex; align-items:center; gap:8px; }
  #pxCtrl .v { color:var(--accent); font-weight:600; }
  .bottom-bar { display:flex; align-items:center; justify-content:center;
    gap:8px; padding:12px 16px; background:rgba(0,0,0,0.4);
    border-top:1px solid rgba(255,255,255,0.06); flex-wrap:wrap; }
  .bottom-bar button { background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,0.15);
    padding:6px 12px; border-radius:8px; font:inherit; font-size:11px;
    cursor:pointer; text-transform:lowercase; letter-spacing:0.04em; transition:all 0.15s; }
  .bottom-bar button:hover { border-color:var(--accent); }
  .bottom-bar button.on { background:var(--accent); color:#1a0e06; border-color:var(--accent); }
  #err { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#ff4444; color:white; padding:20px 30px; border-radius:10px;
    font-family:monospace; font-size:14px; max-width:80%; display:none; z-index:10; }
</style>
</head>
<body>
<div class="chat-frame">
  <div class="video-area">
    <canvas id="stage"></canvas>
    <div id="vitalsBar"></div>
    <div id="stateLabel">mood: <b id="stateName">idle</b></div>
    <div id="pxCtrl" style="display:none;">
      px <input id="pxSize" type="range" min="2" max="12" value="2" step="1" style="width:80px;">
      <span class="v" id="pxVal">2</span>
      <span style="margin-left:8px;">dither</span>
      <input type="checkbox" id="ditherOn" checked>
    </div>
  </div>
  <div class="bottom-bar" id="states">
    <button data-state="idle" class="on">idle</button>
    <button data-state="happy">happy</button>
    <button data-state="listening">listening</button>
    <button data-state="thinking">thinking</button>
    <button data-state="talking">talking</button>
    <button data-state="confused">confused</button>
    <button data-state="alert">alert</button>
    <button data-state="sleepy">sleepy</button>
    <button data-state="excited">excited</button>
    <button data-state="attitude">attitude</button>
    <button data-state="laughing">laughing</button>
    <button data-state="annoyed">annoyed</button>
  </div>
</div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const errEl = document.getElementById('err');
  function showErr(m) { errEl.textContent = m; errEl.style.display = 'block'; }
  window.addEventListener('error', e => showErr('Error: ' + e.message));
  if (!window.THREE) { showErr('three.js failed to load'); return; }

  const embedded = window.parent !== window;
  const vitalsBar = document.getElementById('vitalsBar');
  const DEFAULT_VITALS = { mood: 0.65, hunger: 0.52, energy: 0.55 };

  function formatVitals(v) {
    if (!v) return '';
    const mood = typeof v.mood === 'number' ? v.mood.toFixed(2) : '?';
    const hunger = typeof v.hunger === 'number' ? v.hunger.toFixed(2) : '?';
    let line = 'mood: <b>' + mood + '</b> · hunger: <b>' + hunger + '</b>';
    if (typeof v.hunger === 'number' && v.hunger >= 0.42) {
      line += ' · <span style="opacity:0.75">try feeding me</span>';
    } else if (typeof v.mood === 'number' && v.mood <= 0.42) {
      line += ' · <span style="opacity:0.75">pet me?</span>';
    }
    return line;
  }

  if (embedded) {
    document.getElementById('stateLabel').style.display = 'none';
    document.getElementById('states').style.display = 'none';
    if (vitalsBar) {
      vitalsBar.style.display = 'block';
      vitalsBar.innerHTML = formatVitals(DEFAULT_VITALS);
    }
  } else {
    document.getElementById('pxCtrl').style.display = 'flex';
  }

  function applyCompanionState(s) {
    if (!s || !states[s]) return;
    if (s === currentState) return;
    prevState = currentState; currentState = s; blendT = 0;
    document.getElementById('stateName').textContent = s;
  }

  function applyCompanionVitals(v) {
    if (!vitalsBar || !v) return;
    vitalsBar.innerHTML = formatVitals(v);
  }

  const cvs = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: false });
  renderer.setPixelRatio(1); renderer.setClearColor(0x111018);

  let renderTarget, pixelSize = 2;
  function makeRT() {
    const w = Math.max(32, Math.floor(cvs.clientWidth / pixelSize));
    const h = Math.max(32, Math.floor(cvs.clientHeight / pixelSize));
    if (renderTarget) renderTarget.dispose();
    renderTarget = new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      format: THREE.RGBAFormat, generateMipmaps: false,
    });
    if (typeof postMat !== 'undefined') postMat.uniforms.tDiffuse.value = renderTarget.texture;
  }
  function resize() {
    const w = cvs.clientWidth, h = cvs.clientHeight;
    renderer.setSize(w, h, false); makeRT();
    camera.aspect = w / h; camera.updateProjectionMatrix();
    postMat.uniforms.uResolution.value.set(w, h);
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0.05, 3.8); camera.lookAt(0, 0.05, 0);

  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  scene.add(new THREE.AmbientLight(0xfff4e0, 0.65));
  const keyL = new THREE.DirectionalLight(0xfff0d0, 0.9);
  keyL.position.set(1, 1.5, 3); scene.add(keyL);
  const fillL = new THREE.DirectionalLight(0x99b8ff, 0.35);
  fillL.position.set(-2, 0.5, 1); scene.add(fillL);

  // ── TOON MATERIALS ──────────────────────────────────────────
  const gradient = new Uint8Array([60, 130, 200, 255]);
  const gradTex = new THREE.DataTexture(gradient, gradient.length, 1, THREE.LuminanceFormat);
  gradTex.minFilter = THREE.NearestFilter; gradTex.magFilter = THREE.NearestFilter;
  gradTex.needsUpdate = true;
  function toonMat(c) { return new THREE.MeshToonMaterial({ color: c, gradientMap: gradTex }); }

  const furOrange = toonMat(0xd4853a);   // main shiba orange
  const furCream  = toonMat(0xf0dcc0);   // white/cream cheeks + muzzle
  const furDark   = toonMat(0xb06828);   // darker orange shadow
  const noseMat   = toonMat(0x1a1a1a);   // black nose
  const eyeMat    = toonMat(0x2a1a10);   // dark brown eyes
  const mouthMat  = toonMat(0x3a2a1a);   // mouth
  const pinkMat   = toonMat(0xf0c0a0);   // inner ear
  const whiteMat  = toonMat(0xffffff);   // eye highlights
  const tongueMat = toonMat(0xe06080);   // tongue (for happy panting)

  const wrapper = new THREE.Group();
  wrapper.rotation.y = -Math.PI / 2;
  scene.add(wrapper);
  const headPivot = new THREE.Group();
  wrapper.add(headPivot);
  const S = 2.5;

  // ── HEAD — round, slightly wider than tall, fox-like ────────
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28 * S, 20, 16), furOrange);
  head.scale.set(1.0, 0.95, 1.1);
  headPivot.add(head);

  // Cream face mask — lighter area covering cheeks + muzzle
  const faceMask = new THREE.Mesh(new THREE.SphereGeometry(0.26 * S, 18, 14), furCream);
  faceMask.position.set(0.06 * S, -0.06 * S, 0);
  faceMask.scale.set(0.85, 0.65, 1.05);
  headPivot.add(faceMask);

  // Forehead wedge — darker orange marking above eyes
  const forehead = new THREE.Mesh(new THREE.SphereGeometry(0.15 * S, 14, 10), furDark);
  forehead.position.set(0.08 * S, 0.15 * S, 0);
  forehead.scale.set(1.0, 0.5, 1.2);
  headPivot.add(forehead);

  // ── EARS — upright triangles, orange outside, pink inside ───
  function makeEar(zOff) {
    const pivot = new THREE.Group();
    pivot.position.set(-0.02 * S, 0.16 * S, zOff * S);
    const outer = new THREE.Mesh(new THREE.ConeGeometry(0.1 * S, 0.2 * S, 4), furOrange);
    outer.position.y = 0.1 * S; pivot.add(outer);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.06 * S, 0.13 * S, 4), pinkMat);
    inner.position.set(0.01 * S, 0.07 * S, 0); pivot.add(inner);
    return pivot;
  }
  const earL = makeEar(0.16);
  const earR = makeEar(-0.16);
  headPivot.add(earL, earR);

  // ── EYES — dark, pushed well past head surface ──────────────
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.055 * S, 10, 8), eyeMat);
  eyeL.position.set(0.34 * S, 0.04 * S, 0.13 * S);
  eyeL.scale.set(0.5, 0.85, 0.8);
  headPivot.add(eyeL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.055 * S, 10, 8), eyeMat);
  eyeR.position.set(0.34 * S, 0.04 * S, -0.13 * S);
  eyeR.scale.set(0.5, 0.85, 0.8);
  headPivot.add(eyeR);
  // Catchlights
  const hlL = new THREE.Mesh(new THREE.SphereGeometry(0.015 * S, 6, 4), whiteMat);
  hlL.position.set(0.36 * S, 0.055 * S, 0.12 * S); headPivot.add(hlL);
  const hlR = new THREE.Mesh(new THREE.SphereGeometry(0.015 * S, 6, 4), whiteMat);
  hlR.position.set(0.36 * S, 0.055 * S, -0.12 * S); headPivot.add(hlR);

  // ── SNOUT — small protruding muzzle, cream colored ──────────
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.1 * S, 12, 10), furCream);
  snout.position.set(0.25 * S, -0.06 * S, 0);
  snout.scale.set(0.8, 0.55, 0.75);
  headPivot.add(snout);

  // ── NOSE — black, prominent, on tip of snout ───────────────
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.04 * S, 10, 8), noseMat);
  nose.position.set(0.32 * S, -0.03 * S, 0);
  nose.scale.set(0.6, 0.55, 0.8);
  headPivot.add(nose);

  // ── MOUTH — dark line below nose ────────────────────────────
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.025 * S, 10, 8), mouthMat);
  mouth.position.set(0.28 * S, -0.1 * S, 0);
  mouth.scale.set(0.3, 0.15, 2.0);
  headPivot.add(mouth);

  // Tongue (for panting in happy/excited — starts hidden)
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.03 * S, 8, 6), tongueMat);
  tongue.position.set(0.3 * S, -0.14 * S, 0);
  tongue.scale.set(0.5, 0, 1.2); // scaleY=0 = hidden
  headPivot.add(tongue);

  // Mouth interior
  const mouthInside = new THREE.Mesh(new THREE.SphereGeometry(0.03 * S, 8, 6), mouthMat);
  mouthInside.position.set(0.26 * S, -0.12 * S, 0);
  mouthInside.scale.set(0.4, 0, 1.5);
  headPivot.add(mouthInside);

  // ── NECK — continuation below head ──────────────────────────
  const neck = new THREE.Mesh(new THREE.SphereGeometry(0.22 * S, 14, 10), furCream);
  neck.position.set(-0.02 * S, -0.28 * S, 0);
  neck.scale.set(0.9, 0.5, 0.85);
  headPivot.add(neck);

  // ── POST-PROCESS ────────────────────────────────────────────
  const postScene = new THREE.Scene();
  const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const PALETTE = [
    [0xd4/255,0x85/255,0x3a/255], // orange
    [0xf0/255,0xdc/255,0xc0/255], // cream
    [0xb0/255,0x68/255,0x28/255], // dark orange
    [0xf0/255,0xc0/255,0xa0/255], // pink inner ear
    [0x1a/255,0x1a/255,0x1a/255], // black nose
    [0x2a/255,0x1a/255,0x10/255], // dark eye
    [0xe0/255,0x60/255,0x80/255], // tongue
    [0x11/255,0x10/255,0x18/255], // bg
    [0xff/255,0xff/255,0xff/255], // white
    [0x3a/255,0x2a/255,0x1a/255], // mouth
    [0xf0/255,0xe8/255,0xd8/255], // light cream
    [0x90/255,0x50/255,0x20/255], // deep shadow
  ];
  const postMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: null },
      uPalette: { value: new Float32Array(PALETTE.flat()) },
      uPaletteSize: { value: PALETTE.length },
      uUsePalette: { value: 1.0 },
      uUseDither: { value: 1.0 },
      uResolution: { value: new THREE.Vector2(1, 1) },
    },
    vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
    fragmentShader: `
      precision mediump float;
      varying vec2 vUv;
      uniform sampler2D tDiffuse;
      uniform vec3 uPalette[12];
      uniform int uPaletteSize;
      uniform float uUsePalette, uUseDither;
      uniform vec2 uResolution;
      float bayer(vec2 p){
        int x=int(mod(p.x,4.)),y=int(mod(p.y,4.)),i=x+y*4;
        if(i==0)return 0.;if(i==1)return 8.;if(i==2)return 2.;if(i==3)return 10.;
        if(i==4)return 12.;if(i==5)return 4.;if(i==6)return 14.;if(i==7)return 6.;
        if(i==8)return 3.;if(i==9)return 11.;if(i==10)return 1.;if(i==11)return 9.;
        if(i==12)return 15.;if(i==13)return 7.;if(i==14)return 13.;return 5.;
      }
      vec3 quantize(vec3 c){
        float best=99.;vec3 bc=c;
        for(int i=0;i<12;i++){if(i>=uPaletteSize)break;
          vec3 d=c-uPalette[i];float dist=dot(d,d);
          if(dist<best){best=dist;bc=uPalette[i];}}
        return bc;
      }
      void main(){
        vec3 c=texture2D(tDiffuse,vUv).rgb;
        if(uUseDither>.5){float d=(bayer(vUv*uResolution/5.)/16.-.5)*.08;c+=vec3(d);}
        if(uUsePalette>.5)c=quantize(c);
        gl_FragColor=vec4(c,1.);
      }`,
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

  document.getElementById('pxSize').oninput = e => {
    pixelSize = parseInt(e.target.value);
    document.getElementById('pxVal').textContent = pixelSize;
    makeRT();
  };
  document.getElementById('ditherOn').onchange = e => {
    postMat.uniforms.uUseDither.value = e.target.checked ? 1 : 0;
  };

  // ═══════════════════════════════════════════════════════════
  // STATES
  // ═══════════════════════════════════════════════════════════
  let currentState = 'idle', prevState = 'idle', blendT = 1;
  const BT = 0.35;

  function reset() {
    headPivot.position.set(0, 0, 0);
    headPivot.rotation.set(0, 0, 0);
    head.scale.set(1.0, 0.95, 1.1);
    earL.rotation.set(0, 0, 0); earR.rotation.set(0, 0, 0);
    eyeL.scale.set(0.5, 0.85, 0.8); eyeR.scale.set(0.5, 0.85, 0.8);
    mouth.scale.set(0.3, 0.15, 2.0);
    mouth.position.y = -0.1 * S;
    tongue.scale.y = 0;
    mouthInside.scale.y = 0;
  }

  function openMouth(amt, w) {
    mouthInside.scale.y = amt * 0.6 * w;
    mouth.scale.y = 0.15 + amt * 0.2 * w;
    mouth.position.y = -0.1 * S - amt * 0.01 * S * w;
  }

  function showTongue(amt, w) {
    tongue.scale.y = amt * 0.8 * w;
    tongue.position.y = -0.14 * S - amt * 0.015 * S * w;
  }

  const states = {
    idle: (t, dt, w) => {
      // Gentle panting breath
      headPivot.position.y += Math.sin(t * 1.8) * 0.01 * w;
      // Occasional ear twitch
      const tw = Math.max(0, Math.sin(t * 0.6) - 0.93) * 14;
      earR.rotation.z += tw * 0.2 * w;
      earL.rotation.x += Math.sin(t * 0.5) * 0.02 * w;
    },

    happy: (t, dt, w) => {
      // Bouncy! Classic shiba excitement
      headPivot.position.y += Math.abs(Math.sin(t * 3.5)) * 0.025 * w;
      // Squinted happy eyes — the shiba smile
      eyeL.scale.y = 0.85 - 0.55 * w; eyeR.scale.y = 0.85 - 0.55 * w;
      // Ears forward
      earL.rotation.x += 0.2 * w; earR.rotation.x += 0.2 * w;
      // Panting with tongue out!
      openMouth(0.6, w);
      showTongue(1.0, w);
      // Happy tilt
      headPivot.rotation.z += Math.sin(t * 2) * 0.06 * w;
    },

    listening: (t, dt, w) => {
      // Ears perked and rotating (shiba radar ears)
      earL.rotation.z += -0.15 * w; earR.rotation.z += 0.15 * w;
      earL.rotation.x += -0.15 * w; earR.rotation.x += -0.15 * w;
      earL.rotation.y += Math.sin(t * 1.5) * 0.1 * w;
      earR.rotation.y += Math.sin(t * 1.5 + 0.3) * 0.1 * w;
      // Head tilts toward sound
      headPivot.rotation.z += 0.1 * w;
      headPivot.rotation.y += Math.sin(t * 0.6) * 0.06 * w;
      // Slightly wide eyes
      eyeL.scale.y = 0.85 + 0.1 * w; eyeR.scale.y = 0.85 + 0.1 * w;
    },

    thinking: (t, dt, w) => {
      // Head tipped, looking up
      headPivot.rotation.x += 0.12 * w;
      headPivot.rotation.z += -0.12 * w;
      headPivot.position.y += 0.02 * w;
      // One ear cocked
      earR.rotation.z += Math.sin(t * 1.8) * 0.1 * w;
      // Slow drift
      headPivot.rotation.y += Math.sin(t * 0.4) * 0.12 * w;
    },

    talking: (t, dt, w) => {
      // Mouth open/close — shiba "woo woo" bark
      const mAmt = Math.sin(t * 6) * 0.5 + 0.5;
      openMouth(mAmt * 0.7, w);
      // Head bobs with each bark
      headPivot.rotation.x += Math.sin(t * 3) * 0.06 * w;
      headPivot.position.y += Math.sin(t * 6) * 0.015 * w;
      // Ears alert
      earL.rotation.x += 0.1 * w; earR.rotation.x += 0.1 * w;
      // Emphasis
      headPivot.rotation.z += Math.sin(t * 1.2) * 0.06 * w;
    },

    confused: (t, dt, w) => {
      // Classic dog head tilt!
      headPivot.rotation.z += 0.4 * w;
      headPivot.rotation.y += Math.sin(t * 1.0) * 0.1 * w;
      // One ear up, one floppy
      earL.rotation.z += -0.15 * w;
      earR.rotation.z += 0.35 * w;
      // Wide curious eyes
      eyeL.scale.y = 0.85 + 0.12 * w; eyeR.scale.y = 0.85 + 0.12 * w;
    },

    alert: (t, dt, w) => {
      // Eyes wide, ears stiff forward
      eyeL.scale.y = 0.85 + 0.12 * w; eyeR.scale.y = 0.85 + 0.12 * w;
      earL.rotation.z += -0.12 * w; earR.rotation.z += 0.12 * w;
      earL.rotation.x += -0.15 * w; earR.rotation.x += -0.15 * w;
      // Head scanning
      headPivot.rotation.y += Math.sin(t * 1.0) * 0.25 * w;
      headPivot.position.y = 0.02 * w;
    },

    sleepy: (t, dt, w) => {
      // Eyes closing — fighting sleep
      eyeL.scale.y = 0.85 - (0.45 + Math.sin(t * 0.4) * 0.3) * w;
      eyeR.scale.y = 0.85 - (0.45 + Math.sin(t * 0.4) * 0.3) * w;
      // Head droops
      headPivot.rotation.x += -0.12 * w;
      headPivot.position.y += -0.03 * w;
      // Nodding off
      headPivot.rotation.x += Math.sin(t * 0.3) * 0.08 * w;
      // Ears relax
      earL.rotation.z += 0.2 * w; earR.rotation.z += -0.2 * w;
      earL.rotation.x += 0.15 * w; earR.rotation.x += 0.15 * w;
    },

    excited: (t, dt, w) => {
      // Full body wiggle — shiba zoomies energy
      headPivot.position.y += Math.sin(t * 7) * 0.03 * w;
      headPivot.rotation.z += Math.sin(t * 6) * 0.12 * w;
      headPivot.position.x += Math.sin(t * 5) * 0.02 * w;
      // Panting with tongue
      openMouth(0.8, w);
      showTongue(1.0, w);
      // Wide happy eyes
      eyeL.scale.y = 0.85 - 0.4 * w; eyeR.scale.y = 0.85 - 0.4 * w;
      // Ears bouncing
      earL.rotation.x += Math.sin(t * 7) * 0.15 * w;
      earR.rotation.x += Math.sin(t * 7 + 0.5) * 0.15 * w;
    },

    attitude: (t, dt, w) => {
      // Shiba sass — the famous "I don't care" face
      headPivot.position.y += 0.03 * w;
      headPivot.rotation.z += 0.18 * w;
      headPivot.rotation.y += -0.18 * w; // looking away
      // Squinted disdain
      eyeL.scale.y = 0.85 - 0.4 * w; eyeR.scale.y = 0.85 - 0.4 * w;
      // One ear cocked
      earL.rotation.z += -0.05 * w;
      earR.rotation.z += 0.2 * w;
      // Subtle sway
      headPivot.rotation.z += Math.sin(t * 1.0) * 0.03 * w;
    },

    laughing: (t, dt, w) => {
      // Open mouth, tongue out, head rocking
      openMouth(0.9, w);
      showTongue(0.8, w);
      headPivot.rotation.x += 0.1 * w + Math.sin(t * 5) * 0.06 * w;
      headPivot.position.y += Math.abs(Math.sin(t * 5)) * 0.02 * w;
      // Crinkled happy eyes
      eyeL.scale.y = 0.85 - 0.55 * w; eyeR.scale.y = 0.85 - 0.55 * w;
      // Ears bounce
      earL.rotation.x += Math.sin(t * 5) * 0.1 * w;
      earR.rotation.x += Math.sin(t * 5 + 0.5) * 0.1 * w;
    },

    annoyed: (t, dt, w) => {
      // Narrow eyes, ears back
      eyeL.scale.y = 0.85 - 0.45 * w; eyeR.scale.y = 0.85 - 0.45 * w;
      earL.rotation.z += 0.3 * w; earR.rotation.z += -0.3 * w;
      earL.rotation.x += 0.2 * w; earR.rotation.x += 0.2 * w;
      // Head turned slightly away
      headPivot.rotation.y += 0.18 * w;
      // Slow deliberate blink
      const sb = Math.max(0, Math.sin(t * 0.2) - 0.9) * 10;
      eyeL.scale.y -= sb * 0.3 * w;
      eyeR.scale.y -= sb * 0.3 * w;
    },
  };

  document.querySelectorAll('#states button').forEach(b => {
    b.onclick = () => {
      const s = b.dataset.state;
      if (s === currentState) return;
      prevState = currentState; currentState = s; blendT = 0;
      document.querySelectorAll('#states button').forEach(x => x.classList.toggle('on', x === b));
      document.getElementById('stateName').textContent = s;
    };
  });

  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'companion:update') {
      if (e.data.state) applyCompanionState(e.data.state);
      if (e.data.vitals) applyCompanionVitals(e.data.vitals);
      return;
    }
    if (e.data.type === 'companion:state' && states[e.data.state]) {
      applyCompanionState(e.data.state);
    }
    if (e.data.type === 'companion:vitals') {
      applyCompanionVitals(e.data.vitals);
    }
  });

  const clock = new THREE.Clock();
  let t = 0;
  makeRT(); resize();
  postMat.uniforms.tDiffuse.value = renderTarget.texture;

  function tick() {
    const dt = Math.min(0.05, clock.getDelta());
    t += dt;
    blendT = Math.min(1, blendT + dt / BT);
    const w1 = blendT, w0 = 1 - blendT;
    reset();
    if (w0 > .001) states[prevState](t, dt, w0);
    states[currentState](t, dt, w1);
    headPivot.rotation.y += mouseX * 0.18;
    headPivot.rotation.x += mouseY * 0.1;
    postMat.uniforms.tDiffuse.value = renderTarget.texture;
    renderer.setRenderTarget(renderTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, orthoCam);
    requestAnimationFrame(tick);
  }
  tick();
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
