# ==========================================================================
# Concept keywords — broad classification for PetCompanion routing
# These give the runtime classifier a fast path: any message containing
# these signals leans toward routing to the pet brain even when no
# specific topic rule matches.
# ==========================================================================

[concept_keywords]
PetCompanion = [
  # Pet name and nicknames (most specific)
  "luna",
  "lulu",

  # Owner-to-pet endearments
  "pretty girl",
  "good girl",
  "good kitty",
  "sweet girl",
  "sweetie",
  "kitty",

  # Cat species vocabulary
  "meow",
  "mrrp",
  "mrrowr",
  "purr",
  "purring",
  "tail flick",
  "slow blink",
  "kneading",
  "headbutt",
  "head bump",
  "kek kek",
  "chirping",

  # Pet-context interaction phrases
  "want to play",
  "want a treat",
  "feather wand",
  "laser pointer",
  "the carrier",
  "the vacuum",
  "litter box",
  "cat tree",
  "cat tower",
  "windowsill",

  # Universal pet vocabulary
  "feed the cat",
  "pet the cat",
  "the cat is",
  "my cat",

  # Household and environment signals
  "cooking",
  "laundry",
  "sunny",
  "raining",
  "doorbell",
  "brushies",
  "nails",
  "nap",
  "sleeping",
  "cute",
  "soft",
  "fluffy",
]

# ==========================================================================
# action_target → concept mapping for training-time routing
# Merged into the main file's [action_target_concepts] section.
# Add this so JSONL examples with action_target = "pet_chat" route to the
# PetCompanion concept during the training pipeline.
# ==========================================================================

[action_target_concepts]
pet_chat = "PetCompanion"
pet_create = "PetCompanion"
pet_questionnaire = "PetCompanion"
pet_traits_set = "PetCompanion"