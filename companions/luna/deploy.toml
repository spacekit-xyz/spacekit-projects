# Agent deploy manifest for `spacekit storage deploy --package deploy.toml`
# Paths are relative to this file unless absolute.

[artifacts]
wasm = "/Users/astor/Projects/2026/spacekit/spacekit-standard-library/target/wasm32-unknown-unknown/release/spacekit_growformer_agent.wasm"
bin = "agent/luna-v3-3d.bin"
inference_toml = "data/inference_pets.toml"
guardrails_jsonl = "data/inference_guardrails.jsonl"
fragments_jsonl = "data/luna_fragments_v2.jsonl"
topic_graph = "data/knowledge_graph_pet_overlay.toml"
grounding_toml = "data/pet_world_grounding.toml"
companion_ui = "ui/cat-video-chat-v2.html"

[agent]
id = "luna-3d-the-cat-agent-001"
owner_did = "did:spacekit:user:astor"

[project]
# Optional: read growformer.brain_storage_key when [hub].brain_key is omitted
gf_toml = "luna.gf.toml"

[storage]
# url = "http://52.86.249.214:3031"
url = "http://localhost:3030"
# owner_key_algorithm = "Kyber1024"

[receipt]
path = "deploy-receipt.json"

[hub]
# Must match AGENT_BRAIN in spacekit-growformer-agent/src/lib.rs
brain_key = "chat_brain"
capabilities = ["Pet companion"]
tag_label = "PETS"
tag_color = "#f59e0b"
hub_response_format = "plain" # growformer | plain — plain hides Analysis/Scores in chat
hub_companion_ui = "luna_3d"       # fetched from storage-node companion_ui artifact
thinking_label = "Purring"
op = 1
input_format = "op_string"     # chat contract: [0x01][len: u16][utf8]
inference_toml = true
guardrails_jsonl = true
topic_graph = true
grounding_toml = true
fragments_jsonl = true

[marketplace]
publish = true
title = "Luna 3D the Cat"
description = "Growformer-backed agent for Luna the 3D Cat pet companion."
category = "ai"
access = "public"
price = "0.000" # pay-per-use aUSD; use "free" for no charge
marketplace_id = "default"


# Optional: preload sample prompts for the agent
# These are served to the website via the agent's FactPackage metadata
# so the frontend does not need to hardcode them.

[prompts]
format = "chat"

[prompts.categories]
smoke          = { label = "Smoke test",       color = "#f59e0b" }
discrimination = { label = "Discrimination",   color = "#10b981" }
greeting       = { label = "Greetings",        color = "#38bdf8" }
ood            = { label = "Out of domain",    color = "#a78bfa" }
proactive      = { label = "Proactive",        color = "#f472b6" }
sequence       = { label = "Multi-turn",       color = "#fb923c" }
determinism    = { label = "Determinism",      color = "#64748b" }
feeding        = { label = "Feed Luna",        color = "#fb923c" }
misfire        = { label = "Guardrail misfire", color = "#ef4444" }

