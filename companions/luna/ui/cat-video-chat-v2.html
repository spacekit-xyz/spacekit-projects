<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cat Video Chat</title>
<style>
  :root { --bg:#1a1822; --ink:#f3ecdc; --accent:#ffb454; --muted:#9a93a8; --panel:rgba(20,18,28,0.82); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; overflow:hidden; }

  .chat-frame { position:absolute; inset:0; display:flex; flex-direction:column; }
  .video-area { flex:1; position:relative; overflow:hidden; background:#111018; }
  .video-area canvas {
    position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }

  #stateLabel {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.5); backdrop-filter:blur(8px);
    padding:4px 14px; border-radius:20px;
    font-size:12px; color:var(--muted); letter-spacing:0.08em;
    text-transform:lowercase; pointer-events:none;
  }
  #stateLabel b { color:var(--accent); }

  #vitalsBar {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
    padding:4px 12px; border-radius:16px;
    font-size:10px; color:var(--muted); letter-spacing:0.04em;
    font-family:"IBM Plex Mono","Courier New",monospace;
    pointer-events:none; white-space:nowrap; z-index:2;
    display:none;
  }
  #vitalsBar b { color:var(--accent); font-weight:600; }

  .bottom-bar {
    display:flex; align-items:center; justify-content:center;
    gap:8px; padding:12px 16px;
    background:rgba(0,0,0,0.4);
    border-top:1px solid rgba(255,255,255,0.06);
    flex-wrap:wrap;
  }
  .bottom-bar button {
    background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,0.15);
    padding:6px 12px; border-radius:8px; font:inherit; font-size:11px;
    cursor:pointer; text-transform:lowercase; letter-spacing:0.04em;
    transition:all 0.15s;
  }
  .bottom-bar button:hover { border-color:var(--accent); }
  .bottom-bar button.on { background:var(--accent); color:#1a1206; border-color:var(--accent); }

  #pxCtrl { position:absolute; top:60px; right:16px;
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08); border-radius:10px;
    padding:8px 12px; font-size:11px; color:var(--muted);
    display:flex; align-items:center; gap:8px; }
  #pxCtrl .v { color:var(--accent); font-weight:600; }
  #err { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#ff4444; color:white; padding:20px 30px; border-radius:10px;
    font-family:monospace; font-size:14px; max-width:80%; display:none; z-index:10; }
</style>
</head>
<body>

<div class="chat-frame">

  <div class="video-area">
    <canvas id="stage"></canvas>
    <div id="vitalsBar"></div>
    <div id="stateLabel">mood: <b id="stateName">idle</b></div>
  </div>

</div>

<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  const errEl = document.getElementById('err');
  function showErr(m) { errEl.textContent = m; errEl.style.display = 'block'; }
  window.addEventListener('error', e => showErr('Error: ' + e.message));
  if (!window.THREE) { showErr('three.js failed to load'); return; }

  // Embedded in Agent Hub — bottom mood label covers the face; vitals go top.
  const embedded = window.parent !== window;
  const vitalsBar = document.getElementById('vitalsBar');
  const DEFAULT_VITALS = { mood: 0.65, hunger: 0.52, energy: 0.55 };

  function formatVitals(v) {
    if (!v) return '';
    const mood = typeof v.mood === 'number' ? v.mood.toFixed(2) : '?';
    const hunger = typeof v.hunger === 'number' ? v.hunger.toFixed(2) : '?';
    let line = 'mood: <b>' + mood + '</b> · hunger: <b>' + hunger + '</b>';
    if (typeof v.hunger === 'number' && v.hunger >= 0.42) {
      line += ' · <span style="opacity:0.75">try feeding me</span>';
    } else if (typeof v.mood === 'number' && v.mood <= 0.42) {
      line += ' · <span style="opacity:0.75">pet me?</span>';
    }
    return line;
  }

  if (embedded) {
    document.getElementById('stateLabel').style.display = 'none';
    if (vitalsBar) {
      vitalsBar.style.display = 'block';
      vitalsBar.innerHTML = formatVitals(DEFAULT_VITALS);
    }
  }

  function applyCompanionState(s) {
    if (!s || !states[s]) return;
    if (s === currentState) return;
    prevState = currentState; currentState = s; blendT = 0;
    document.getElementById('stateName').textContent = s;
  }

  function applyCompanionVitals(v) {
    if (!vitalsBar || !v) return;
    vitalsBar.innerHTML = formatVitals(v);
  }

  const cvs = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: false });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x111018);

  let renderTarget;
  let pixelSize = 2;
  
  function makeRT() {
    const w = Math.max(32, Math.floor(cvs.clientWidth / pixelSize));
    const h = Math.max(32, Math.floor(cvs.clientHeight / pixelSize));
    if (renderTarget) renderTarget.dispose();
    renderTarget = new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      format: THREE.RGBAFormat, generateMipmaps: false,
    });
  }

  function resize() {
    const w = cvs.clientWidth, h = cvs.clientHeight;
    renderer.setSize(w, h, false);
    makeRT();
    postMat.uniforms.tDiffuse.value = renderTarget.texture;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    postMat.uniforms.uResolution.value.set(w, h);
  }

  const scene = new THREE.Scene();
  // Camera looking at the cat face-on
  const camera = new THREE.PerspectiveCamera(45, 1, 1, 100);
  camera.position.set(0, 0.05, 3.5);
  camera.lookAt(0, 0.05, 0);

  // Mouse parallax
  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  // Lights
  scene.add(new THREE.AmbientLight(0xfff4e0, 0.7));
  const keyL = new THREE.DirectionalLight(0xfff0d0, 0.9);
  keyL.position.set(0, 1.5, 3); scene.add(keyL);
  const fillL = new THREE.DirectionalLight(0x99b8ff, 0.35);
  fillL.position.set(-2, 0.5, 1); scene.add(fillL);

  // ── CAT HEAD — same geometry as the full-body cat, scaled 2.5x ──
  const gradient = new Uint8Array([60, 130, 200, 255]);
  const gradTex = new THREE.DataTexture(gradient, gradient.length, 1, THREE.LuminanceFormat);
  gradTex.minFilter = THREE.NearestFilter; gradTex.magFilter = THREE.NearestFilter;
  gradTex.needsUpdate = true;
  function toonMat(c) { return new THREE.MeshToonMaterial({ color: c, gradientMap: gradTex }); }

  const fur = toonMat(0xf5a020);
  const cream = toonMat(0xffe8b8);
  const stripe = toonMat(0x8a3a08);
  const pinkMat = toonMat(0xf8a8c8);
  const darkMat = toonMat(0x2a1810);

  // The headPivot is what we animate — it faces +X by default,
  // so we parent it inside a wrapper that rotates it to face +Z (camera)
  const wrapper = new THREE.Group();
  wrapper.rotation.y = -Math.PI / 2;
  scene.add(wrapper);

  const headPivot = new THREE.Group();
  wrapper.add(headPivot);

  // Scale everything up (these values are the v4 cat head × ~2.5)
  const S = 2.5;

  // Head sphere
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.26 * S, 20, 16), fur);
  head.position.set(0.05 * S, 0, 0);
  headPivot.add(head);

  // Ears — same shape as v4, scaled
  function makeEar(zOff) {
    const pivot = new THREE.Group();
    pivot.position.set(0.05 * S, 0.12 * S, zOff * S);
    const outer = new THREE.Mesh(new THREE.ConeGeometry(0.11 * S, 0.22 * S, 4), fur);
    outer.position.y = 0.11 * S; pivot.add(outer);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.06 * S, 0.14 * S, 4), pinkMat);
    inner.position.set(0.01 * S, 0.07 * S, 0); pivot.add(inner);
    return pivot;
  }
  const earL = makeEar(0.14);
  const earR = makeEar(-0.14);
  headPivot.add(earL, earR);

  // Eyes — same dark spheres as v4
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05 * S, 10, 8), darkMat);
  eyeL.position.set(0.24 * S, 0.04 * S, 0.1 * S);
  headPivot.add(eyeL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.05 * S, 10, 8), darkMat);
  eyeR.position.set(0.24 * S, 0.04 * S, -0.1 * S);
  headPivot.add(eyeR);

  // Nose — same pink sphere
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.025 * S, 8, 6), pinkMat);
  nose.position.set(0.3 * S, -0.04 * S, 0);
  headPivot.add(nose);

  // Mouth — small dark shape below nose, scalable for talking
  const mouth = new THREE.Mesh(
    new THREE.SphereGeometry(0.015 * S, 8, 6),
    darkMat
  );
  mouth.position.set(0.28 * S, -0.1 * S, 0);
  mouth.scale.set(0.5, 0.5, 1);
  headPivot.add(mouth);

  // Neck / chin — slight fur-colored continuation below head
  const neck = new THREE.Mesh(new THREE.SphereGeometry(0.2 * S, 14, 10), fur);
  neck.position.set(0, -0.3 * S, 0);
  neck.scale.set(1, 0.6, 0.9);
  headPivot.add(neck);

  // Forehead stripes
  for (let i = -1; i <= 1; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.015 * S, 0.08 * S, 0.025 * S), stripe);
    s.position.set(0.12 * S, 0.22 * S, i * 0.08 * S);
    headPivot.add(s);
  }

  // ── Post-process ────────────────────────────────────────────
  const postScene = new THREE.Scene();
  const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const PALETTE = [
    [0x2a/255,0x18/255,0x10/255],[0xf5/255,0xa0/255,0x20/255],
    [0xd4/255,0x7a/255,0x10/255],[0xff/255,0xe8/255,0xb8/255],
    [0x8a/255,0x3a/255,0x08/255],[0xf8/255,0xa8/255,0xc8/255],
    [0x11/255,0x10/255,0x18/255],[0xff/255,0xff/255,0xff/255],
    [0x4a/255,0x3d/255,0x52/255],[0xc4/255,0x3a/255,0x3a/255],
    [0x4a/255,0xde/255,0x80/255],[0xf5/255,0xc8/255,0x42/255],
  ];
  const postMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: null },
      uPalette: { value: new Float32Array(PALETTE.flat()) },
      uPaletteSize: { value: PALETTE.length },
      uUsePalette: { value: 1.0 },
      uUseDither: { value: 1.0 },
      uResolution: { value: new THREE.Vector2(1, 1) },
    },
    vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
    fragmentShader: `
      precision mediump float;
      varying vec2 vUv;
      uniform sampler2D tDiffuse;
      uniform vec3 uPalette[12];
      uniform int uPaletteSize;
      uniform float uUsePalette;
      uniform float uUseDither;
      uniform vec2 uResolution;
      float bayer(vec2 p){
        int x=int(mod(p.x,4.)),y=int(mod(p.y,4.)),i=x+y*4;
        if(i==0)return 0.;if(i==1)return 8.;if(i==2)return 2.;if(i==3)return 10.;
        if(i==4)return 12.;if(i==5)return 4.;if(i==6)return 14.;if(i==7)return 6.;
        if(i==8)return 3.;if(i==9)return 11.;if(i==10)return 1.;if(i==11)return 9.;
        if(i==12)return 15.;if(i==13)return 7.;if(i==14)return 13.;return 5.;
      }
      vec3 quantize(vec3 c){
        float best=99.;vec3 bc=c;
        for(int i=0;i<12;i++){if(i>=uPaletteSize)break;
          vec3 d=c-uPalette[i];float dist=dot(d,d);
          if(dist<best){best=dist;bc=uPalette[i];}}
        return bc;
      }
      void main(){
        vec3 c=texture2D(tDiffuse,vUv).rgb;
        if(uUseDither>.5){float d=(bayer(vUv*uResolution/5.)/16.-.5)*.08;c+=vec3(d);}
        if(uUsePalette>.5)c=quantize(c);
        gl_FragColor=vec4(c,1.);
      }`,
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

  // document.getElementById('pxSize').oninput = e => {
  //   pixelSize = parseInt(e.target.value);
  //   document.getElementById('pxVal').textContent = pixelSize;
  //   makeRT(); postMat.uniforms.tDiffuse.value = renderTarget.texture;
  // };
  // document.getElementById('ditherOn').onchange = e => {
  //   postMat.uniforms.uUseDither.value = e.target.checked ? 1 : 0;
  // };

  // ═══════════════════════════════════════════════════════════
  // STATES — same eye/ear animation approach as v4 body cat
  // ═══════════════════════════════════════════════════════════
  let currentState = 'idle', prevState = 'idle', blendT = 1;
  const BT = 0.35;

  function reset() {
    headPivot.position.set(0, 0, 0);
    headPivot.rotation.set(0, 0, 0);
    head.scale.set(1, 1, 1);
    earL.rotation.set(0, 0, 0); earR.rotation.set(0, 0, 0);
    eyeL.scale.set(1, 1, 1); eyeR.scale.set(1, 1, 1);
    mouth.scale.set(0.5, 0.5, 1);
    mouth.position.y = -0.1 * S;
  }

  const states = {
    idle: (t, dt, w) => {
      // Breathing bob
      headPivot.position.y += Math.sin(t * 1.5) * 0.015 * w;
      // Occasional ear twitch
      const tw = Math.max(0, Math.sin(t * 0.7) - 0.93) * 14;
      earR.rotation.z += tw * 0.25 * w;
      // Gentle tail sway on the ears (subtle life)
      earL.rotation.x += Math.sin(t * 0.4) * 0.03 * w;
    },

    happy: (t, dt, w) => {
      // Bounce
      headPivot.position.y += Math.abs(Math.sin(t * 3.5)) * 0.03 * w;
      // Squinted happy eyes
      eyeL.scale.y = 1 - 0.6 * w; eyeR.scale.y = 1 - 0.6 * w;
      // Ears forward
      earL.rotation.x += 0.25 * w; earR.rotation.x += 0.25 * w;
      // Slight tilt
      headPivot.rotation.z += Math.sin(t * 2) * 0.06 * w;
    },

    listening: (t, dt, w) => {
      // Ears perked and tracking
      earL.rotation.z += -0.15 * w; earR.rotation.z += 0.15 * w;
      earL.rotation.x += -0.15 * w; earR.rotation.x += -0.15 * w;
      earL.rotation.y += Math.sin(t * 1.5) * 0.12 * w;
      earR.rotation.y += Math.sin(t * 1.5 + 0.3) * 0.12 * w;
      // Eyes slightly wide
      eyeL.scale.y = 1 + 0.15 * w; eyeR.scale.y = 1 + 0.15 * w;
      // Head tilts toward speaker
      headPivot.rotation.z += 0.1 * w;
      headPivot.rotation.y += Math.sin(t * 0.6) * 0.06 * w;
    },

    thinking: (t, dt, w) => {
      // Head tilted up
      headPivot.rotation.x += 0.15 * w;
      headPivot.rotation.z += -0.15 * w;
      headPivot.position.y += 0.03 * w;
      // One ear cocked
      earL.rotation.z += -0.15 * w;
      earR.rotation.z += Math.sin(t * 1.8) * 0.12 * w;
      // Slow drift side-to-side
      headPivot.rotation.y += Math.sin(t * 0.4) * 0.15 * w;
    },

    talking: (t, dt, w) => {
      // Mouth opens and closes
      const mAmt = Math.sin(t * 8) * 0.5 + 0.5;
      mouth.scale.y = 0.5 + mAmt * 2.5 * w;
      mouth.scale.z = 1 + mAmt * 1.0 * w;
      mouth.position.y = -0.1 * S - mAmt * 0.02 * S * w;
      // Speech nod
      headPivot.rotation.x += Math.sin(t * 4) * 0.05 * w;
      headPivot.position.y += Math.sin(t * 4) * 0.01 * w;
      // Ears relaxed forward
      earL.rotation.x += 0.1 * w; earR.rotation.x += 0.1 * w;
      // Emphasis tilts
      headPivot.rotation.z += Math.sin(t * 1.2) * 0.07 * w;
    },

    confused: (t, dt, w) => {
      // Big head tilt
      headPivot.rotation.z += 0.35 * w;
      // Uncertain wobble
      headPivot.rotation.y += Math.sin(t * 1.2) * 0.12 * w;
      // Asymmetric ears — one up, one flopped
      earL.rotation.z += -0.2 * w; earL.rotation.x += -0.1 * w;
      earR.rotation.z += 0.45 * w;
      // Wide eyes
      eyeL.scale.y = 1 + 0.2 * w; eyeR.scale.y = 1 + 0.2 * w;
    },

    alert: (t, dt, w) => {
      // Eyes very wide
      eyeL.scale.y = 1 + 0.3 * w; eyeR.scale.y = 1 + 0.3 * w;
      eyeL.scale.x = 1 + 0.15 * w; eyeR.scale.x = 1 + 0.15 * w;
      // Ears straight up
      earL.rotation.z += -0.15 * w; earR.rotation.z += 0.15 * w;
      earL.rotation.x += -0.15 * w; earR.rotation.x += -0.15 * w;
      // Head scanning side to side
      headPivot.rotation.y += Math.sin(t * 0.9) * 0.25 * w;
      // Tense — no bob
      headPivot.position.y = 0;
    },

    sleepy: (t, dt, w) => {
      // Eyes closing
      eyeL.scale.y = 1 - (0.5 + Math.sin(t * 0.5) * 0.35) * w;
      eyeR.scale.y = 1 - (0.5 + Math.sin(t * 0.5) * 0.35) * w;
      // Head droops
      headPivot.rotation.x += -0.15 * w;
      headPivot.position.y += -0.04 * w;
      // Nodding off cycle
      headPivot.rotation.x += Math.sin(t * 0.3) * 0.1 * w;
      // Ears relaxed back
      earL.rotation.z += 0.3 * w; earR.rotation.z += -0.3 * w;
      earL.rotation.x += 0.2 * w; earR.rotation.x += 0.2 * w;
    },

    attitude: (t, dt, w) => {
      // Head high, cocked, looking away
      headPivot.position.y += 0.04 * w;
      headPivot.rotation.z += 0.22 * w;
      headPivot.rotation.y += -0.15 * w;
      // Half-lidded disdain
      eyeL.scale.y = 1 - 0.45 * w; eyeR.scale.y = 1 - 0.45 * w;
      // One ear cocked
      earL.rotation.z += -0.05 * w;
      earR.rotation.z += 0.25 * w;
      // Subtle sway
      headPivot.rotation.z += Math.sin(t * 1.2) * 0.04 * w;
    },

    fear: (t, dt, w) => {
      // Pulled back
      headPivot.position.y += -0.05 * w;
      headPivot.position.z += -0.05 * w;
      // Trembling
      headPivot.position.x += Math.sin(t * 25) * 0.01 * w;
      // Ears flat back
      earL.rotation.z += 0.6 * w; earR.rotation.z += -0.6 * w;
      earL.rotation.x += 0.35 * w; earR.rotation.x += 0.35 * w;
      // Eyes huge
      eyeL.scale.y = 1 + 0.4 * w; eyeR.scale.y = 1 + 0.4 * w;
      eyeL.scale.x = 1 + 0.3 * w; eyeR.scale.x = 1 + 0.3 * w;
    },

    laughing: (t, dt, w) => {
      // Mouth open wide
      mouth.scale.y = 0.5 + 2.5 * w;
      mouth.scale.z = 1 + 1.5 * w;
      mouth.position.y = -0.1 * S - 0.025 * S * w;
      // Head rocking back
      headPivot.rotation.x += 0.12 * w + Math.sin(t * 6) * 0.07 * w;
      headPivot.position.y += Math.abs(Math.sin(t * 6)) * 0.02 * w;
      // Squinted crinkle eyes
      eyeL.scale.y = 1 - 0.65 * w; eyeR.scale.y = 1 - 0.65 * w;
      // Ears bounce
      earL.rotation.x += Math.sin(t * 6) * 0.12 * w;
      earR.rotation.x += Math.sin(t * 6 + 0.5) * 0.12 * w;
    },

    annoyed: (t, dt, w) => {
      // Narrow eyes
      eyeL.scale.y = 1 - 0.5 * w; eyeR.scale.y = 1 - 0.5 * w;
      // Ears flat sideways
      earL.rotation.z += 0.4 * w; earR.rotation.z += -0.4 * w;
      // Head turned away
      headPivot.rotation.y += 0.2 * w;
      // Slow deliberate blinks
      const sb = Math.max(0, Math.sin(t * 0.2) - 0.9) * 10;
      eyeL.scale.y -= sb * 0.4 * w;
      eyeR.scale.y -= sb * 0.4 * w;
    },

    hungry: (t, dt, w) => {
      // Lean forward, wide eyes, mouth slightly open
      headPivot.rotation.x += 0.12 * w;
      headPivot.position.y += Math.sin(t * 2.5) * 0.012 * w;
      eyeL.scale.y = 1 + 0.25 * w; eyeR.scale.y = 1 + 0.25 * w;
      mouth.scale.y = 0.5 + 0.8 * w;
      earL.rotation.x += -0.2 * w; earR.rotation.x += -0.2 * w;
      // Ankle-weave bob
      headPivot.rotation.z += Math.sin(t * 3) * 0.05 * w;
    },

    eating: (t, dt, w) => {
      // Chew cycle — mouth + small head dip
      const chew = Math.abs(Math.sin(t * 5));
      mouth.scale.y = 0.5 + chew * 1.8 * w;
      mouth.scale.z = 1 + chew * 0.6 * w;
      headPivot.rotation.x += 0.08 * w + chew * 0.04 * w;
      // Content half-lidded eyes
      eyeL.scale.y = 1 - 0.35 * w; eyeR.scale.y = 1 - 0.35 * w;
      earL.rotation.z += 0.1 * w; earR.rotation.z += -0.1 * w;
    },

    comfort: (t, dt, w) => {
      // Soft lean-in, slow blink cadence, gentle purr bob
      headPivot.rotation.z += 0.08 * w;
      headPivot.position.y += Math.sin(t * 1.2) * 0.01 * w;
      eyeL.scale.y = 1 - (0.35 + Math.max(0, Math.sin(t * 0.8) - 0.85) * 3) * w;
      eyeR.scale.y = 1 - (0.35 + Math.max(0, Math.sin(t * 0.8) - 0.85) * 3) * w;
      earL.rotation.x += 0.15 * w; earR.rotation.x += 0.15 * w;
      mouth.scale.y = 0.5 + 0.2 * w;
    },
  };

  document.querySelectorAll('#states button').forEach(b => {
    b.onclick = () => {
      const s = b.dataset.state;
      if (s === currentState) return;
      prevState = currentState; currentState = s; blendT = 0;
      document.querySelectorAll('#states button').forEach(x => x.classList.toggle('on', x === b));
      document.getElementById('stateName').textContent = s;
    };
  });

  // Accept state + vitals from parent frame (AgentHub companion integration)
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'companion:update') {
      if (e.data.state) applyCompanionState(e.data.state);
      if (e.data.vitals) applyCompanionVitals(e.data.vitals);
      return;
    }
    if (e.data.type === 'companion:state' && states[e.data.state]) {
      applyCompanionState(e.data.state);
    }
    if (e.data.type === 'companion:vitals') {
      applyCompanionVitals(e.data.vitals);
    }
  });

  const clock = new THREE.Clock();
  let t = 0;

  makeRT();
  postMat.uniforms.tDiffuse.value = renderTarget.texture;
  resize();

  function tick() {
    const dt = Math.min(0.05, clock.getDelta());
    t += dt;
    blendT = Math.min(1, blendT + dt / BT);
    const w1 = blendT, w0 = 1 - blendT;

    reset();
    if (w0 > .001) states[prevState](t, dt, w0);
    states[currentState](t, dt, w1);

    // Mouse parallax — head tracks cursor like webcam
    headPivot.rotation.y += mouseX * 0.2;
    headPivot.rotation.x += mouseY * 0.1;

    renderer.setRenderTarget(renderTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, orthoCam);
    requestAnimationFrame(tick);
  }
  tick();
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
